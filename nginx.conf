# cut.xenotech.studio — FlowCut 纯前端静态站点
# 沿用 Flops / flowtaskserver 同套约定：80/443 都直接服务 dist/，SSL 证书走共用路径
# FlowCut 没有任何后端 API，因此不需要 /api/* proxy 段

server {
    listen       80;
    server_name  cut.xenotech.studio;
    root         html;

    location / {
        root   /home/ubuntu/flowseries/FlowCut/dist;
        index  index.html index.htm;
        access_log  /home/ubuntu/flowseries/FlowCut/logs/access.log;
        autoindex on;
        try_files $uri /index.html;
    }

    error_log  /home/ubuntu/flowseries/FlowCut/logs/error.log;
}

server {
    listen       443 ssl;
    server_name  cut.xenotech.studio;

    # ssl 证书地址（与其他子站共用）
    ssl_certificate     /home/ubuntu/__ssl__/xenotech.studio/xenotech.studio_bundle.pem;
    ssl_certificate_key  /home/ubuntu/__ssl__/xenotech.studio/xenotech.studio.key;

    # ssl 验证相关配置
    ssl_session_timeout  5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;

    location / {
        root   /home/ubuntu/flowseries/FlowCut/dist;
        index  index.html index.htm;
        access_log  /home/ubuntu/flowseries/FlowCut/logs/access.log;
        autoindex on;
        try_files $uri /index.html;
    }

    error_log  /home/ubuntu/flowseries/FlowCut/logs/error.log;
}
